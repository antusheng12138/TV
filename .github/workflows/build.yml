name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [fongmi]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
      - "build.gradle"
      - "gradle/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 生成签名与 local.properties
        run: |
          keytool -genkeypair -v -keystore release.jks -alias tv -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=tv"
          printf 'storeFile=release.jks\nkeyAlias=tv\nstorePassword=android123\n' > local.properties
          chmod +x gradlew
      - name: 编译 leanback release
        run: ./gradlew :app:assembleLeanbackRelease --no-daemon
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom
          name: 定制版
          files: app/build/outputs/apk/leanback/release/*.apk
